# 일초만련 CI
# - 모든 push / PR: Godot 헤드리스 테스트 실행
# - 테스트 통과 후: Android 디버그 APK 빌드, 아티팩트로 업로드
# 릴리스 서명 키와 비밀값은 사용하지 않는다. 디버그 키스토어는 실행할 때마다 새로 만든다.
name: 테스트 및 Android 디버그 빌드

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"

jobs:
  test:
    name: 헤드리스 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 내려받기
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          ./godot --version

      - name: 리소스 임포트
        run: ./godot --headless --path . --import

      - name: 테스트 실행
        run: ./godot --headless --path . -s res://tests/run_tests.gd

  android-debug:
    name: Android 디버그 APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot 내려받기
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot

      - name: 내보내기 템플릿 캐시
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_RELEASE }}

      - name: 내보내기 템플릿 내려받기
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: 디버그 키스토어 생성 (이번 실행 전용)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Godot 에디터 설정 (Android SDK, JDK 경로)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: 리소스 임포트
        run: ./godot --headless --path . --import

      - name: 디버그 APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/ilcho-manryeon-debug.apk
          ls -la build
          test -s build/ilcho-manryeon-debug.apk

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ilcho-manryeon-debug-apk
          path: build/ilcho-manryeon-debug.apk
          retention-days: 14
